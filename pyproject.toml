[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "otterview-quill"
version = "0.1.0"
description = "A self-hosted knowledge and document workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "httpx[socks]>=0.28,<0.29",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<0.1",
  "python-docx==1.1.2",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["quill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["services", "quill/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
