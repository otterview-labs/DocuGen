[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "otterview-docugen"
version = "0.2.1"
description = "A self-hosted knowledge and document workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.0,<0.163",
  "starlette>=1.3.1,<2",
  "certifi>=2026.10.18",
  "uvicorn[standard]>=0.32,<0.33",
  "httpx[socks]>=0.28,<0.29",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.30,<0.1",
  "python-docx==1.1.2",
  "pypdf>=6.21.4,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["quill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["services", "quill/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
